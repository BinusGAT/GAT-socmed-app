[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_EMBED_ORIGINS"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "functions"

[functions."prune-audit-log"]
  schedule = "@daily"

[functions."keep-warm"]
  schedule = "*/10 * * * *"
